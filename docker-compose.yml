

services:
    backend:
        build: ./backend
        ports:
        - "8000:8000"

        volumes:
            - ./backend:/app

    postgres:
        image: postgres:15
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: buildconnect

        ports:
            - "5432:5432"
        
    redis:
        image: redis:7
        ports:
            - "6379:6379"